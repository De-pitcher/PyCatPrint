[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycatprint"
version = "0.1.0"
description = "A Python CLI tool for controlling BLE thermal printers (cat printers)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["bluetooth", "ble", "thermal printer", "cat printer", "printing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "bleak>=0.21.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pdf2image>=1.16.0",
    "pypdf>=3.0.0",
    "click>=8.1.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
pycatprint = "pycatprint.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/pycatprint"
Repository = "https://github.com/yourusername/pycatprint"
